# Codemagic CI/CD — builds the ELIM iOS app (Capacitor, Swift Package Manager)
# and publishes it to TestFlight. No Mac required.
#
# ONE-TIME SETUP in the Codemagic UI (Teams → Integrations, and the app settings):
#   1. Add an "App Store Connect" API key integration:
#        - In App Store Connect → Users and Access → Integrations → App Store Connect API,
#          create a key with the "App Manager" role, download the .p8, note the Issuer ID
#          and Key ID.
#        - In Codemagic → Teams → your team → Integrations → Apple Developer Portal /
#          App Store Connect → add the key. Give it the name "ELIM ASC Key"
#          (must match `integrations.app_store_connect` below, or change it here).
#   2. Nothing else — Codemagic creates the signing certificate and provisioning
#      profile automatically from that API key (automatic signing).
#
# Then: open this workflow in Codemagic and click "Start new build".

workflows:
  ios-testflight:
    name: ELIM iOS – TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must match the API key name you created in the Codemagic UI (step 1 above).
      app_store_connect: ELIM ASC Key
    environment:
      vars:
        BUNDLE_ID: "com.ccelim.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the web app (Vite)
        script: npm run build
      - name: Sync web assets into the iOS project
        script: npx cap sync ios
      - name: Set the build number (auto-increments each Codemagic build)
        # Deterministic: rewrite CURRENT_PROJECT_VERSION directly. agvtool needs
        # apple-generic versioning configured, which this project doesn't set.
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Write the App Store Connect API key to a file
        # Codemagic injects APP_STORE_CONNECT_* from the "ELIM ASC Key"
        # integration. xcodebuild needs the private key as a .p8 file on disk.
        # Use printf '%b' (not echo): the key arrives with escaped \n, and echo
        # wrote them literally -> "invalidPEMDocument". %b restores real newlines;
        # PEM base64 has no backslashes, so a real-newline key is unaffected.
        script: |
          mkdir -p "$CM_BUILD_DIR/private_keys"
          KEY_PATH="$CM_BUILD_DIR/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          # Safe diagnostics only (no secret material): the header line and count.
          echo "Key ID: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          echo "Key file lines: $(wc -l < "$KEY_PATH")"
          head -c 27 "$KEY_PATH"; echo
      - name: Archive & export the .ipa (raw xcodebuild, automatic signing)
        # Raw xcodebuild so nothing overrides CODE_SIGN_STYLE (build-ipa was
        # force-appending CODE_SIGN_STYLE=Manual). -allowProvisioningUpdates lets
        # Xcode create/reuse the distribution certificate + App Store profile via
        # the API key. The API key ID must be the bare key id (e.g. JKL34TQ44M),
        # NOT the AuthKey_*.p8 filename.
        script: |
          set -e
          KEY_PATH="$CM_BUILD_DIR/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=9K236BL7SX \
            archive
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ios/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - build/ipa/*.ipa
      - $CM_BUILD_DIR/build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight. Flip to true later (and add reviewer info in
        # App Store Connect) when you're ready to push a build to App Store review.
        submit_to_testflight: true
        submit_to_app_store: false
