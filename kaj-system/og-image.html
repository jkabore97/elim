<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #0a0e1a; color: #fff; position: relative; }
  .bg1 { position: absolute; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(79,70,229,.55), transparent); left: -160px; top: -200px; }
  .bg2 { position: absolute; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(6,182,212,.45), transparent); right: -180px; bottom: -260px; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 44px 44px; }
  .wrap { position: absolute; inset: 0; padding: 70px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 18px; font-family: 'Sora', 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 34px; }
  .logo svg { width: 64px; height: 64px; }
  h1 { font-family: 'Sora', 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 74px; line-height: 1.05; letter-spacing: -0.03em; margin: 0; max-width: 900px; }
  h1 span { background: linear-gradient(90deg, #7c74ff, #22d3ee); -webkit-background-clip: text; color: transparent; }
  p { font-size: 28px; color: #c7cce0; margin: 22px 0 0; max-width: 820px; }
  .chips { display: flex; gap: 12px; }
  .chip { padding: 12px 20px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.2); font-weight: 600; font-size: 20px; background: rgba(255,255,255,.06); }
</style></head>
<body>
  <div class="bg1"></div><div class="bg2"></div><div class="grid"></div>
  <div class="wrap">
    <div class="logo"><svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><path d="M20 16v32M20 32l18-16M22 34l18 14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>Kaj System</div>
    <div><h1>We turn your idea into an app <span>people actually use.</span></h1><p>Mobile apps, websites and custom business systems. Fixed prices, clear timelines.</p></div>
    <div class="chips"><span class="chip">iOS &amp; Android</span><span class="chip">Web &amp; PWA</span><span class="chip">Fixed-price packages</span><span class="chip">First demo in 2 weeks</span></div>
  </div>
</body></html>
